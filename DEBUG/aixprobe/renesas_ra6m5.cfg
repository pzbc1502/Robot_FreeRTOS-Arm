# OpenOCD target configuration for Renesas R7FA6M5BF (RA6M5, Cortex-M33).
# This file intentionally configures debug access only. Flash programming is
# left to the Renesas/Keil tooling until a compatible RA flash driver is proven.

source [find target/swj-dp.tcl]

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME ra6m5
}

if { [info exists WORKAREASIZE] } {
	set _WORKAREASIZE $WORKAREASIZE
} else {
	set _WORKAREASIZE 0x8000
}

# Do not hard-code an expected DP ID. RA6M5 lifecycle/security configuration
# can expose different CoreSight discovery details while still using SW-DP.
swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian little -dap $_CHIPNAME.dap

# RA6M5 SRAM begins at 0x20000000. Backup avoids corrupting a live FreeRTOS app.
$_TARGETNAME configure -work-area-phys 0x20000000 \
	-work-area-size $_WORKAREASIZE -work-area-backup 1

# Conservative initial SWD speed; raise only after stable attach is confirmed.
adapter speed 500
adapter srst delay 100
reset_config srst_nogate
cortex_m reset_config sysresetreq

